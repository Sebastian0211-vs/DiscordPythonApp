# Serves the interactive plot pages published by the bot (see README "Interactive plots").
# The pages contain code written by chat users, so every response is sandboxed by CSP:
# scripts run (plots stay interactive) but in an opaque origin, with no access to cookies
# or storage of your domain.
server {
    listen 8080;
    server_name _;
    root /pages;
    autoindex off;
    server_tokens off;

    gzip on;

    location = / {
        return 404;
    }

    location / {
        try_files $uri =404;
        add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-downloads" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, max-age=3600" always;
    }
}
