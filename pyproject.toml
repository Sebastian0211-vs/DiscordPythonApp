[project]
name = "remotepython"
version = "0.1.0"
description = "Discord bot that runs posted Python scripts in a locked-down Docker sandbox"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.6",
]

[project.scripts]
remotepy-bot = "remotepy.bot:main"
remotepy-run = "remotepy.sandbox:_cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remotepy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
